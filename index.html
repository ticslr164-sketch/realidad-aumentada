<!DOCTYPE html>
<html>
<head>
    <title>Mi objeto 3D en RA</title>

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

    <!-- AR.js -->
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@master/aframe/build/aframe-ar.js"></script>
</head>

<body style="margin: 0; overflow: hidden;">

    <a-scene embedded arjs>

        <!-- Marcador Hiro -->
        <a-marker preset="hiro">

            <!-- Piso -->
            <a-plane
                position="0 0 0"
                rotation="-90 0 0"
                width="2"
                height="2"
                color="gray">
            </a-plane>

            <!-- Cuerpo del robot -->
            <a-box
                id="robot"
                position="0 1 0"
                scale="1 1.2 0.7"
                color="blue">
            </a-box>

            <!-- Cabeza -->
            <a-box
                position="0 2.1 0"
                scale="0.7 0.6 0.6"
                color="lightblue">
            </a-box>

            <!-- Ojo izquierdo -->
            <a-sphere
                position="-0.2 2.15 0.3"
                radius="0.08"
                color="black">
            </a-sphere>

            <!-- Ojo derecho -->
            <a-sphere
                position="0.2 2.15 0.3"
                radius="0.08"
                color="black">
            </a-sphere>

            <!-- Brazo izquierdo -->
            <a-box
                position="-0.7 1 0"
                scale="0.2 0.8 0.2"
                color="blue">
            </a-box>

            <!-- Brazo derecho -->
            <a-box
                position="0.7 1 0"
                scale="0.2 0.8 0.2"
                color="blue">
            </a-box>

        </a-marker>

        <!-- Cámara -->
        <a-entity camera></a-entity>

    </a-scene>

    <script>

        let robot = document.querySelector("#robot");

        robot.addEventListener("click", function() {

            // Cambiar color
            robot.setAttribute("color", "red");

            // Cambiar tamaño
            robot.setAttribute(
                "scale",
                "1.5 1.8 1"
            );

            // Cambiar posición
            robot.setAttribute(
                "position",
                "0 1.5 0"
            );

            // Cambiar rotación
            robot.setAttribute(
                "rotation",
                "0 45 0"
            );

        });

    </script>

</body>
</html>
