<!DOCTYPE html>
<html>
<head>
    <title>Mi objeto 3D en Realidad Aumentada</title>

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

    <!-- AR.js -->
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@master/aframe/build/aframe-ar.js"></script>
</head>

<body style="margin: 0; overflow: hidden;">

    <!-- Botón de interacción -->
    <button
        id="boton"
        style="
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            padding: 15px 25px;
            font-size: 18px;
            border: none;
            border-radius: 10px;
            background: white;
        ">
        Cambiar robot
    </button>

    <a-scene
        embedded
        arjs="sourceType: webcam; debugUIEnabled: false;"
        renderer="logarithmicDepthBuffer: true;">

        <!-- MARCADOR HIRO -->
        <a-marker preset="hiro">

            <!-- Piso -->
            <a-plane
                position="0 0 0"
                rotation="-90 0 0"
                width="2"
                height="2"
                color="gray">
            </a-plane>

            <!-- ROBOT COMPLETO -->
            <a-entity
                id="robot"
                position="0 0 0"
                scale="1 1 1"
                rotation="0 0 0">

                <!-- CUERPO -->
                <a-box
                    id="cuerpo"
                    position="0 0.8 0"
                    scale="1 1.2 0.7"
                    color="blue">
                </a-box>

                <!-- CABEZA -->
                <a-box
                    position="0 1.9 0"
                    scale="0.7 0.6 0.6"
                    color="lightblue">
                </a-box>

                <!-- OJO IZQUIERDO -->
                <a-sphere
                    position="-0.2 1.95 0.31"
                    radius="0.08"
                    color="black">
                </a-sphere>

                <!-- OJO DERECHO -->
                <a-sphere
                    position="0.2 1.95 0.31"
                    radius="0.08"
                    color="black">
                </a-sphere>

                <!-- BRAZO IZQUIERDO -->
                <a-box
                    position="-0.7 0.8 0"
                    scale="0.2 0.8 0.2"
                    color="blue">
                </a-box>

                <!-- BRAZO DERECHO -->
                <a-box
                    position="0.7 0.8 0"
                    scale="0.2 0.8 0.2"
                    color="blue">
                </a-box>

                <!-- PIERNA IZQUIERDA -->
                <a-box
                    position="-0.3 -0.1 0"
                    scale="0.3 0.6 0.3"
                    color="blue">
                </a-box>

                <!-- PIERNA DERECHA -->
                <a-box
                    position="0.3 -0.1 0"
                    scale="0.3 0.6 0.3"
                    color="blue">
                </a-box>

            </a-entity>

        </a-marker>

        <!-- CÁMARA -->
        <a-entity camera></a-entity>

    </a-scene>


    <!-- JAVASCRIPT -->
    <script>

        // Obtener el robot
        let robot = document.querySelector("#robot");

        // Obtener el cuerpo
        let cuerpo = document.querySelector("#cuerpo");

        // Obtener el botón
        let boton = document.querySelector("#boton");


        // Cuando se presiona el botón
        boton.addEventListener("click", function() {

            // 1. Cambiar color
            cuerpo.setAttribute("color", "red");


            // 2. Cambiar tamaño
            robot.setAttribute(
                "scale",
                "1.4 1.4 1.4"
            );


            // 3. Cambiar posición
            robot.setAttribute(
                "position",
                "0.5 0.2 0"
            );


            // 4. Cambiar rotación
            robot.setAttribute(
                "rotation",
                "0 45 0"
            );

        });

    </script>

</body>
</html>
